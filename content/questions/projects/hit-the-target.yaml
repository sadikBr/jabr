- id: target.flight
  type: code
  concepts: [projectile-motion, eulers-method, vector-components]
  prompt: "Write the three update lines inside the loop of `landing_distance`: gravity changes `vy`, then the velocity moves `x` and `y`."
  starter: |
    import math

    G = 9.8

    def landing_distance(speed, angle, dt=0.001):
        """How far away a ball lands, launched at `angle` degrees. Found step by step."""
        vx = speed * math.cos(math.radians(angle))
        vy = speed * math.sin(math.radians(angle))
        x, y = 0.0, 0.0
        for _ in range(100_000):        # at most 100 seconds of flight
            # TODO: three lines. Gravity changes vy; the velocity moves x and y.

            if y < 0:
                break                   # it has landed
        return x

    for speed, angle in [(20, 45), (20, 30), (25, 60)]:
        formula = speed**2 * math.sin(math.radians(2 * angle)) / G
        print(f"{speed} m/s at {angle}°: simulated {landing_distance(speed, angle):.2f} m, formula {formula:.2f} m")
  tests: |
    def test_forty_five_degrees():
        assert abs(landing_distance(20, 45) - 40.82) < 0.1, "At 20 m/s and 45° the ball should land about 40.8 m away."

    def test_thirty_degrees():
        assert abs(landing_distance(20, 30) - 35.35) < 0.1, "At 20 m/s and 30° the ball should land about 35.3 m away."

    def test_straight_up_comes_straight_down():
        assert abs(landing_distance(20, 90)) < 0.01, "Thrown straight up, the ball should land where it started."

    def test_a_flat_throw_lands_at_once():
        assert landing_distance(20, 0) < 0.1, "Launched level from the ground, the ball lands almost immediately."

    def test_a_smaller_step_agrees():
        assert abs(landing_distance(15, 40, dt=0.0005) - landing_distance(15, 40)) < 0.05, "Halving the time step should barely change the answer."
  hints:
    - "Gravity only acts downwards: `vy -= G * dt`."
    - "Then both positions move: `x += vx * dt` and `y += vy * dt`."
  solution: |
    ```
    vy -= G * dt
    x += vx * dt
    y += vy * dt
    ```

    The simulated distances match the formula to within a couple of centimetres. The formula was only there to check the loop. From here on the loop does the work.

- id: target.aim
  type: code
  concepts: [projectile-motion, continuity]
  prompt: "Complete `aim`. Inside the loop, decide which half of the range of angles still contains the answer: if a launch at `middle` falls short of the target, raise `low` to `middle`; otherwise lower `high` to `middle`."
  starter: |
    import math

    G = 9.8

    def landing_distance(speed, angle, dt=0.001):
        """How far away a ball lands, launched at `angle` degrees."""
        vx = speed * math.cos(math.radians(angle))
        vy = speed * math.sin(math.radians(angle))
        x, y = 0.0, 0.0
        for _ in range(100_000):
            vy -= G * dt
            x += vx * dt
            y += vy * dt
            if y < 0:
                break
        return x

    def aim(speed, target, tolerance=0.01):
        """The launch angle, between 0 and 40 degrees, that lands on the target."""
        low, high = 0.0, 40.0
        while high - low > tolerance:
            middle = (low + high) / 2
            # TODO: keep the half that contains the answer. Replace the next
            # two lines with an if / else that moves only one end.
            low = middle
            high = middle
        return (low + high) / 2

    for target in [20, 30, 38]:
        angle = aim(20, target)
        print(f"Target at {target} m: aim at {angle:.2f}°, which lands at {landing_distance(20, angle):.2f} m")
  tests: |
    def test_hits_a_target_at_thirty_metres():
        angle = aim(20, 30)
        assert abs(landing_distance(20, angle) - 30) < 0.1, "A launch at the angle returned for a 30 m target should land within 10 cm of it."

    def test_matches_the_formula():
        import math
        expected = 0.5 * math.degrees(math.asin(9.8 * 30 / 20**2))
        assert abs(aim(20, 30) - expected) < 0.1, "For 20 m/s and a target at 30 m, the formula gives about 23.65°."

    def test_a_faster_throw():
        angle = aim(25, 50)
        assert abs(landing_distance(25, angle) - 50) < 0.1, "At 25 m/s, the angle returned for a 50 m target should land within 10 cm of it."

    def test_nearer_targets_need_lower_angles():
        assert aim(20, 15) < aim(20, 25) < aim(20, 35), "Within this range, a further target needs a steeper launch."
  hints:
    - "Falling short means the angle is too low, so the answer lies above `middle`."
    - "`if landing_distance(speed, middle) < target:` then `low = middle`, `else:` `high = middle`."
  solution: |
    ```
    if landing_distance(speed, middle) < target:
        low = middle
    else:
        high = middle
    ```

    The program now aims by itself: about 14.7° for 20 m, 23.7° for 30 m and 34.3° for 38 m, each landing within a few centimetres. It found them by asking one question a dozen times: too short, or too long?

- id: target.air
  type: code
  concepts: [air-drag, projectile-motion, eulers-method]
  prompt: "Replace the two acceleration lines in `landing_distance` so that they include air drag. The drag slows each velocity component by `drag * speed_now` times itself, and gravity still pulls down."
  starter: |
    import math

    G = 9.8

    def landing_distance(speed, angle, drag=0.0, dt=0.001):
        """How far away a ball lands. `drag` is the drag constant divided by the mass."""
        vx = speed * math.cos(math.radians(angle))
        vy = speed * math.sin(math.radians(angle))
        x, y = 0.0, 0.0
        for _ in range(100_000):
            speed_now = math.hypot(vx, vy)
            # TODO: add drag to these two accelerations.
            ax = 0.0
            ay = -G
            vx += ax * dt
            vy += ay * dt
            x += vx * dt
            y += vy * dt
            if y < 0:
                break
        return x

    def aim(speed, target, drag=0.0, tolerance=0.01):
        """The launch angle, between 0 and 40 degrees, that lands on the target."""
        low, high = 0.0, 40.0
        while high - low > tolerance:
            middle = (low + high) / 2
            if landing_distance(speed, middle, drag) < target:
                low = middle
            else:
                high = middle
        return (low + high) / 2

    print(f"The same throw, 20 m/s at 35°: {landing_distance(20, 35):.1f} m without air, {landing_distance(20, 35, 0.01):.1f} m with")

    target = 25
    for drag in [0.0, 0.01]:
        angle = aim(20, target, drag)
        landed = landing_distance(20, angle, drag)
        print(f"Drag {drag}: aim at {angle:.1f}° to hit {target} m (lands at {landed:.2f} m)")
  tests: |
    def test_no_drag_is_unchanged():
        assert abs(landing_distance(20, 45) - 40.82) < 0.1, "With drag = 0 the answer should be the same as before: about 40.8 m."

    def test_air_makes_it_fall_short():
        assert abs(landing_distance(20, 35, 0.01) - 30.32) < 0.15, "With drag = 0.01, a throw at 20 m/s and 35° should land about 30.3 m away."

    def test_drag_acts_sideways_too():
        assert landing_distance(20, 10, 0.05) < landing_distance(20, 10) - 1, "Drag must slow the horizontal motion as well as the vertical: check ax."

    def test_aims_through_the_air():
        angle = aim(20, 25, 0.01)
        assert abs(landing_distance(20, angle, 0.01) - 25) < 0.1, "With air, a launch at the angle returned for a 25 m target should still land within 10 cm of it."

    def test_air_needs_a_steeper_launch():
        assert aim(20, 25, 0.01) > aim(20, 25) + 2, "With air in the way, the same target needs a noticeably higher angle."
  hints:
    - "The drag acceleration on each component is `-drag * speed_now` times that component."
    - "`ax = -drag * speed_now * vx`"
    - "`ay = -G - drag * speed_now * vy`"
  solution: |
    ```
    ax = -drag * speed_now * vx
    ay = -G - drag * speed_now * vy
    ```

    The same throw that reached 38.4 m in a vacuum lands at 30.3 m in air. To hit a target at 25 m you now have to aim at 23.6° rather than 18.9°.

    Look at what did not change: `aim`. The search knew nothing about the physics, so new physics cost it nothing. There is no formula for a throw through air, and your program did not need one.
