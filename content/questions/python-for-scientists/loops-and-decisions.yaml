- id: py.loops.playground
  type: code
  concepts: [py-loops]
  prompt: "This loop prints how far a dropped ball has fallen after 0, 1, 2… seconds. Run it, then make the table longer."
  starter: |
    for t in range(6):
        distance = 0.5 * 9.8 * t**2
        print(t, "s:", distance, "m")

- id: py.loops.range
  type: multiple-choice
  concepts: [py-loops]
  prompt: "Which numbers does `range(2, 10, 3)` produce?"
  choices:
    - id: right
      text: "2, 5, 8"
      correct: true
    - id: includes-end
      text: "2, 5, 8, 11"
      feedback: "A range stops before it reaches the end value, 10. It never goes past it."
    - id: three
      text: "2, 10, 3"
      feedback: "The three numbers are instructions: start at 2, stop before 10, go up in steps of 3."
    - id: all
      text: "2, 3, 4, 5, 6, 7, 8, 9"
      feedback: "That would be `range(2, 10)`. The third number makes it count in threes."
  hints:
    - "Start at the first number, add the third each time, and stop before reaching the second."
  solution: |
    Start at 2 and go up in steps of 3: 2, 5, 8. The next would be 11, which is past the stopping point of 10, so the range ends at 8.

- id: py.loops.code-total
  type: code
  concepts: [py-loops, py-functions]
  prompt: |
    Complete `sum_of_squares` so that it returns $1^2 + 2^2 + \dots + n^2$. Use the accumulate pattern: `total` starts at zero and grows on every pass of the loop.
  starter: |
    def sum_of_squares(n):
        """1² + 2² + ... + n²."""
        total = 0
        for k in range(1, n + 1):
            # Replace the next line: add this number's square to the total.
            total = total
        return total

    print(sum_of_squares(3))     # 1 + 4 + 9
    print(sum_of_squares(100))
  tests: |
    def test_first_three():
        assert sum_of_squares(3) == 14, "1 + 4 + 9 = 14."

    def test_just_one():
        assert sum_of_squares(1) == 1, "With n = 1 there is only 1² to add."

    def test_a_hundred():
        assert sum_of_squares(100) == 338350, "The squares from 1 to 100 add up to 338 350."

    def test_nothing_to_add():
        assert sum_of_squares(0) == 0, "With n = 0 the loop never runs, and the total stays at zero."
  hints:
    - "The square of `k` is `k**2`."
    - "`total = total + k**2`"
  solution: |
    `total = total + k**2`

    Notice `range(1, n + 1)`: because a range stops before its end value, you need `n + 1` to include `n` itself. The squares up to 100 add to 338 350.

- id: py.loops.trace
  type: multiple-choice
  concepts: [py-loops]
  prompt: |
    What does this program print?

    ```
    total = 0
    for i in range(4):
        total = total + i
    print(total)
    ```
  choices:
    - id: six
      text: "`6`"
      correct: true
    - id: ten
      text: "`10`"
      feedback: "That would be 1 + 2 + 3 + 4. But `range(4)` starts at 0 and stops before 4."
    - id: four
      text: "`4`"
      feedback: "The loop runs four times, but it adds the value of `i` each time, not 1."
    - id: three
      text: "`3`"
      feedback: "3 is the last value of `i`. The program prints `total`, which has been adding them all up."
  hints:
    - "List the values `i` takes, then add them."
  solution: |
    `range(4)` gives 0, 1, 2, 3. The total goes 0, 1, 3, 6, so the program prints 6.

- id: py.loops.code-bounces
  type: code
  concepts: [py-loops, py-functions]
  prompt: "A ball is dropped from a height, and after each bounce it rises to a fixed fraction of its previous height. Complete `count_bounces` so that it returns how many bounces it takes before the ball rises less than `limit` metres."
  starter: |
    def count_bounces(height, ratio, limit):
        """How many bounces until the ball rises less than `limit` metres."""
        bounces = 0
        while height >= limit:
            # Replace the next line: the ball loses height and one more bounce is counted.
            height = 0
        return bounces

    print(count_bounces(10, 0.6, 1))
    print(count_bounces(2, 0.9, 0.1))
  tests: |
    def test_ten_metres_at_sixty_percent():
        assert count_bounces(10, 0.6, 1) == 5, "From 10 m at 60% the heights go 6, 3.6, 2.16, 1.296, 0.78: it drops below 1 m on the 5th bounce."

    def test_already_below_the_limit():
        assert count_bounces(0.5, 0.6, 1) == 0, "A ball starting below the limit needs no bounces at all."

    def test_a_bouncier_ball():
        assert count_bounces(2, 0.9, 0.1) == 29, "From 2 m at 90%, it takes 29 bounces to fall below 0.1 m."

    def test_one_bounce():
        assert count_bounces(1.5, 0.5, 1) == 1, "From 1.5 m at 50% the first bounce reaches 0.75 m, already below 1 m."
  hints:
    - "Two things change on each bounce: the height is multiplied by `ratio`, and the count goes up by one."
    - "Use two lines: `height = height * ratio` and `bounces = bounces + 1`."
  solution: |
    ```
    height = height * ratio
    bounces = bounces + 1
    ```

    You could not have used a `for` loop here without already knowing the answer. A `while` loop keeps going until the condition says stop: 5 bounces for the first ball, 29 for the bouncier one.

- id: py.loops.code-state
  type: code
  concepts: [py-conditionals, py-functions]
  prompt: 'Complete `state_of_water` so that it returns the text `"ice"` below 0 °C, `"steam"` at 100 °C or above, and `"water"` in between.'
  starter: |
    def state_of_water(temperature):
        """The state of water at a temperature in °C: "ice", "water" or "steam"."""
        # Replace the next line with an if / elif / else.
        return "water"

    for temperature in [-20, 0, 25, 99.9, 100, 250]:
        print(temperature, "°C:", state_of_water(temperature))
  tests: |
    def test_frozen():
        assert state_of_water(-20) == "ice", "Below 0 °C the answer should be \"ice\"."

    def test_liquid():
        assert state_of_water(25) == "water", "At 25 °C the answer should be \"water\"."

    def test_boiling():
        assert state_of_water(250) == "steam", "Above 100 °C the answer should be \"steam\"."

    def test_the_boundaries():
        assert state_of_water(0) == "water", "Exactly 0 °C counts as water: ice is strictly below zero."
        assert state_of_water(100) == "steam", "Exactly 100 °C counts as steam."
        assert state_of_water(99.9) == "water", "99.9 °C is still water."
  hints:
    - 'Start with `if temperature < 0:` and return `"ice"` inside it.'
    - "Then `elif temperature >= 100:` for steam, and `else:` for everything in between."
  solution: |
    ```
    if temperature < 0:
        return "ice"
    elif temperature >= 100:
        return "steam"
    else:
        return "water"
    ```

    The boundaries are where the bugs live. `<` leaves exactly 0 °C as water, and `>=` makes exactly 100 °C steam, as the question asked.

- id: py.loops.how-many
  type: multiple-choice
  concepts: [py-loops]
  prompt: "How many times does the body of `for i in range(1, 10):` run?"
  choices:
    - id: nine
      text: "9 times"
      correct: true
    - id: ten
      text: "10 times"
      feedback: "`range(1, 10)` stops before 10, so the last value is 9: that makes nine values, 1 to 9."
    - id: eleven
      text: "11 times"
      feedback: "Neither end is counted twice. The values are 1, 2, …, 9."
    - id: eight
      text: "8 times"
      feedback: "Both 1 and 9 are included: count them and you get nine."
  hints:
    - "Write out the first and last values `i` takes."
  solution: |
    The values are 1, 2, 3, 4, 5, 6, 7, 8, 9: nine of them. A quick check for any `range(a, b)` is `b - a`, here `10 - 1 = 9`.

- id: py.loops.forever
  type: multiple-choice
  concepts: [py-loops]
  prompt: |
    Which of these loops never stops?
  choices:
    - id: no-change
      text: "`x = 10` then `while x > 0: print(x)`"
      correct: true
    - id: counts-down
      text: "`x = 10` then `while x > 0: x = x - 3`"
      feedback: "`x` goes 7, 4, 1, −2, and the loop stops as soon as it is no longer above zero."
    - id: never-starts
      text: "`x = 0` then `while x > 0: x = x + 1`"
      feedback: "The condition is false from the start, so the body never runs at all."
    - id: for-loop
      text: "`for x in range(1000000): print(x)`"
      feedback: "It is long, but a `for` loop over a range always ends."
  hints:
    - "For each one, ask: does anything inside the loop change the value being tested?"
  solution: |
    In the first loop nothing changes `x`, so `x > 0` stays true for ever. A `while` loop only ends if its body eventually makes the condition false.

- id: py.loops.equals
  type: multiple-choice
  concepts: [py-conditionals]
  prompt: "You want to run some code only when `count` is exactly 3. Which line starts that `if` statement correctly?"
  choices:
    - id: double
      text: "`if count == 3:`"
      correct: true
    - id: single
      text: "`if count = 3:`"
      feedback: "A single `=` stores a value. Python reports this as an error rather than guess what you meant."
    - id: no-colon
      text: "`if count == 3`"
      feedback: "The comparison is right, but the line must end with a colon."
    - id: equals-word
      text: "`if count equals 3:`"
      feedback: "Python has no `equals` keyword. The comparison is written `==`."
  hints:
    - "One `=` stores. Two `==` compare."
  solution: |
    `==` asks whether two values are equal, and the `if` line ends with a colon before its indented block.

- id: py.loops.explain
  type: self-check
  concepts: [py-loops]
  prompt: "When would you choose a `while` loop rather than a `for` loop? Give an example of a task suited to each."
  rubric:
    - "You said a `for` loop suits a known number of repetitions, or going through a known set of values."
    - "You said a `while` loop suits repeating until something happens, when you cannot say in advance how many passes that takes."
    - "You gave a sensible example of each."
  solution: |
    Use `for` when you know what you are looping over: the numbers 1 to 100, or the hours in a day. Use `while` when you are waiting for a condition: keep halving until the value is below a threshold, or keep stepping a falling ball forwards until it reaches the ground.

    Printing a table of 10 rows is a `for` loop. Counting how many bounces a ball makes before it stops is a `while` loop.
