services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jabr
      POSTGRES_PASSWORD: jabr
      POSTGRES_DB: jabr
    ports:
      - "5432:5432"
    volumes:
      - jabr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jabr -d jabr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jabr-db:
